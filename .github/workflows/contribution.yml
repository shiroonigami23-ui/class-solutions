name: 'Process Contribution on Issue Close'

on:
  issues:
    types: [closed]

permissions:
  contents: write
  issues: read

jobs:
  process-contribution:
    runs-on: ubuntu-latest
    
    # We still have the gatekeeper, but we will now log what it sees.
    if: startsWith(github.event.issue.title, 'File Submission:')
    
    steps:
      # --- DEBUGGING STEP 1 ---
      # This will print the raw event data. We can see the EXACT issue title here.
      - name: 'Dump GitHub context'
        env:
          GITHUB_CONTEXT: ${{ toJSON(github.event) }}
        run: echo "$GITHUB_CONTEXT"

      - name: 'Checkout repository'
        uses: actions/checkout@v4

      - name: 'Set up Python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 'Extract Info from Issue'
        id: extract_info
        run: |
          # Extract filename and username
          FILENAME=$(echo "${{ github.event.issue.title }}" | sed 's/File Submission: //')
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          
          USERNAME="${{ github.event.issue.user.login }}"
          echo "USERNAME=$USERNAME" >> $GITHUB_ENV

          # Extract the file attachment URL from the issue body
          URL=$(echo "${{ github.event.issue.body }}" | grep -oP '\[.*\]\(\K[^)]+' | head -n 1)
          echo "FILE_URL=$URL" >> $GITHUB_ENV
          
      # --- DEBUGGING STEP 2 ---
      # This will show us if the variables were extracted correctly.
      - name: 'Print Extracted Variables'
        run: |
          echo "Extracted Filename: ${{ env.FILENAME }}"
          echo "Extracted Username: ${{ env.USERNAME }}"
          echo "Extracted File URL: ${{ env.FILE_URL }}"

      - name: 'Validate and Download Contribution File'
        run: |
          if [[ -z "${{ env.FILE_URL }}" ]]; then
            echo "::error::Could not find a file attachment URL in the issue body."
            echo "Please ensure the file was dragged and dropped into the issue description."
            exit 1
          fi
          curl -L -o "${{ env.FILENAME }}" "${{ env.FILE_URL }}"
          echo "Successfully downloaded ${{ env.FILENAME }}"

      - name: 'Run update_contributors.py'
        run: |
          echo "Attempting to run update_contributors.py..."
          python update_contributors.py "${{ env.FILENAME }}" "${{ env.USERNAME }}"
          echo "Finished running update_contributors.py."
        
      - name: 'Regenerate index.html'
        run: python "generate_index.py"
        
      - name: 'Commit and push all changes'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add "${{ env.FILENAME }}" contributors.json index.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat(bot): Add ${{ env.FILENAME }} from @${{ env.USERNAME }}"
            git push
          fi
