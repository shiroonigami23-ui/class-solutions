name: 'Process Contribution on Issue Close'

on:
  issues:
    types: [closed]

permissions:
  contents: write
  issues: read

jobs:
  process-contribution:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'File Submission:')
    
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4

      - name: 'Set up Python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 'Extract Info and Sanitize Filename'
        id: extract_info
        run: |
          # --- SAFER FILENAME EXTRACTION ---
          RAW_FILENAME=$(echo "${{ github.event.issue.title }}" | sed 's/File Submission: //')

          # --- MORE ROBUST CLEANING ---
          # 1. Replace special chars (except ., _, -) with _
          # 2. Squeeze multiple spaces/underscores into one _
          # 3. Remove any single trailing underscore
          SAFE_FILENAME=$(echo "$RAW_FILENAME" | \
            sed 's/[^A-Za-z0-9._ -]/_/g' | \
            tr -s '[:space:]_' '_' | \
            sed 's/_$//')

          echo "Original Filename: $RAW_FILENAME"
          echo "Sanitized Filename: $SAFE_FILENAME"
          echo "FILENAME=$SAFE_FILENAME" >> $GITHUB_ENV
          
          USERNAME="${{ github.event.issue.user.login }}"
          echo "USERNAME=$USERNAME" >> $GITHUB_ENV

          # --- MORE ROBUST URL FINDER ---
          URL=$(echo "${{ github.event.issue.body }}" | grep -o 'https://[a-zA-Z0-9./-]*' | head -n 1)
          echo "Found URL: $URL"
          echo "FILE_URL=$URL" >> $GITHUB_ENV
          
      - name: 'Validate and Download Contribution File'
        run: |
          if [[ -z "${{ env.FILE_URL }}" ]]; then
            echo "::error::Could not find a file attachment URL in the issue body."
            echo "Make sure the file was uploaded to the issue, creating a link."
            exit 1
          fi
          echo "Downloading from ${{ env.FILE_URL }} and saving as ${{ env.FILENAME }}"
          curl -L -o "${{ env.FILENAME }}" "${{ env.FILE_URL }}"
          echo "Download complete."

      - name: 'Update contributors.json'
        run: python update_contributors.py "${{ env.FILENAME }}" "${{ env.USERNAME }}"
        
      - name: 'Regenerate index.html'
        run: python "generate_index.py"
        
      - name: 'Commit and push all changes'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          echo "Adding files to git: ${{ env.FILENAME }}, contributors.json, index.html"
          git add "${{ env.FILENAME }}" contributors.json index.html
          
          if git diff --staged --quiet; then
            echo "No new changes to commit. (Check generate_index.py)"
          else
            git commit -m "feat(bot): Add ${{ env.FILENAME }} from @${{ env.USERNAME }}"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/shiroonigami23-ui/class-solutions.git HEAD:main
          fi
          
